[project]
name = "accessories-processing"
version = "0.1.0"
description = "Parts library service: upload, background removal, embeddings, semantic search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pgvector==0.3.2",
    "pydantic-settings==2.5.2",
    "python-multipart==0.0.12",
    "saq==0.12.3",
    "redis==5.1.0",
    "rembg==2.0.59",
    "sentence-transformers==3.1.1",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "Pillow==10.4.0",
    "numpy==1.26.4",
    "sse-starlette==2.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
